<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Leaf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 700px) {
            .container { grid-template-columns: 1fr; }
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; grid-column: 1/-1; }
        .subtitle { text-align: center; color: #777; margin-bottom: 20px; font-size: 0.9rem; grid-column: 1/-1; }
        .panel {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
        }
        .panel h2 { font-size: 1.1rem; color: #444; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 0.9rem; }
        select, input[type="file"] {
            width: 100%; padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 0.95rem;
        }
        select:focus, input[type="file"]:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .result {
            margin-top: 15px; padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 0.95rem;
            color: #333;
        }
        .color-result {
            margin-top: 10px; padding: 10px;
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 0.9rem;
        }
        /* Chatbox */
        .chat-box {
            height: 250px;
            overflow-y: auto;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .chat-msg.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        .chat-msg.bot {
            background: #f0f0f0;
            color: #333;
        }
        .chat-input {
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1; padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .chat-input input:focus { outline: none; border-color: #667eea; }
        .chat-input button {
            padding: 10px 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Know Your Leaf</h1>
        <p class="subtitle">AI-Powered Plant Leaf Health Diagnosis</p>

        <!-- Left Panel: Diagnosis -->
        <div class="panel">
            <h2>Diagnose Your Plant</h2>

            <div class="form-group">
                <label>Plant</label>
                <select id="plant">
                    {% for p in plants %}
                    <option value="{{ p }}">{{ p | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Leaf Color</label>
                <select id="color">
                    {% for c in colors %}
                    <option value="{{ c }}">{{ c | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Or Upload Leaf Photo</label>
                <input type="file" id="image" accept="image/*">
            </div>

            <button class="btn" onclick="diagnose()">Diagnose</button>
            <button class="btn" onclick="uploadImage()" style="background: linear-gradient(135deg, #4caf50, #2e7d32);">Analyze Image</button>

            <div class="result" id="result"></div>
            <div class="color-result" id="colorResult"></div>
        </div>

        <!-- Right Panel: Chatbot -->
        <div class="panel">
            <h2>Chat with Plant Doctor</h2>
            <div class="chat-box" id="chatBox">
                <div class="chat-msg bot">Hi! Ask me about your plant. Example: "What is wrong with my brown tomato leaf?"</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        function diagnose() {
            const plant = document.getElementById('plant').value;
            const color = document.getElementById('color').value;
            const formData = new FormData();
            formData.append('plant', plant);
            formData.append('color', color);
            fetch('/predict', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('result');
                    el.textContent = data.result;
                    el.style.display = 'block';
                });
        }

        function uploadImage() {
            const fileInput = document.getElementById('image');
            if (!fileInput.files[0]) {
                alert('Please select an image first');
                return;
            }
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('colorResult');
                    el.textContent = 'Detected dominant color: ' + data.color.toUpperCase();
                    el.style.display = 'block';
                });
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            addChatMsg(msg, 'user');
            input.value = '';
            fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            })
            .then(r => r.json())
            .then(data => addChatMsg(data.response, 'bot'));
        }

        function addChatMsg(text, type) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + type;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
